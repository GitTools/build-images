on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      dotnet_variant:
        required: true
        type: string
      dotnet_versions:
        required: true
        type: string
      docker_distros:
        required: true
        type: string
      push_images:
        required: true
        type: boolean
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"
  PUSH_IMAGES: ${{ inputs.push_images }}

permissions:
  packages: write

jobs:
  build_images:
    name: ${{ matrix.docker_distro }} - net${{ matrix.dotnet_version }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        docker_distro: ${{ fromJson(inputs.docker_distros) }}
        dotnet_version: ${{ fromJson(inputs.dotnet_versions) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use cached cake frosting
        id: cache-cake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: run
          key: run-${{ runner.os }}-${{ hashFiles('./build/**') }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: build/global.json

      - name: Set up Docker
        uses: ./.github/actions/docker-setup

      - name: Load DockerHub credentials
        id: dockerhub-creds
        if: env.PUSH_IMAGES == 'true'
        uses: gittools/cicd/dockerhub-creds@824c3d773fb5d1b00c26b474ae88b7ce9ae555ee # v5
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Publish image to DockerHub
        if: env.PUSH_IMAGES == 'true'
        uses: ./.github/actions/build-images
        with:
          arch: ${{ inputs.arch }}
          dotnet_variant: ${{ inputs.dotnet_variant }}
          dotnet_version: ${{ matrix.dotnet_version }}
          docker_distro: ${{ matrix.docker_distro }}
          docker_registry: docker.io
          docker_registry_name: dockerhub
          docker_registry_username: ${{ steps.dockerhub-creds.outputs.docker_username }}
          docker_registry_password: ${{ steps.dockerhub-creds.outputs.docker_password }}

      - name: Publish image to GitHub
        uses: ./.github/actions/build-images
        with:
          arch: ${{ inputs.arch }}
          dotnet_variant: ${{ inputs.dotnet_variant }}
          dotnet_version: ${{ matrix.dotnet_version }}
          docker_distro: ${{ matrix.docker_distro }}
          docker_registry: ghcr.io
          docker_registry_name: github
          docker_registry_username: ${{ github.repository_owner }}
          docker_registry_password: ${{ github.token }}

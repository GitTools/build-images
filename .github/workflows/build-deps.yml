name: Build Deps

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 11 * * 1,4"

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
      packages: write
    name: Prepare Build
    runs-on: ubuntu-24.04
    outputs:
      docker_distros: ${{ steps.set_matrix.outputs.docker_distros }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cake frosting
        id: cache-cake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: run
          key: run-${{ runner.os }}-${{ hashFiles('./build/**') }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: build/global.json

      - name: "[Prepare]"
        if: steps.cache-cake.outputs.cache-hit != 'true'
        run: dotnet build build/ --configuration=Release

      - name: "[Matrix]"
        id: set_matrix
        run: dotnet run/build.dll --target=SetMatrix

  build_deps:
    permissions:
      contents: read
      id-token: write
      packages: write
    name: Build Deps (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/_build-deps.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      docker_distros: ${{ needs.prepare.outputs.docker_distros }}
      push_images: ${{ github.event_name != 'pull_request' && github.repository_owner == 'GitTools' }}
      dockerhub_oidc_connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

  build_deps_manifests:
    permissions:
      contents: read
      id-token: write
      packages: write
    name: Build Deps Manifests
    needs: [prepare, build_deps]
    uses: ./.github/workflows/_build-deps-manifest.yml
    with:
      docker_distros: ${{ needs.prepare.outputs.docker_distros }}
      push_images: ${{ github.event_name != 'pull_request' && github.repository_owner == 'GitTools' }}
      dockerhub_oidc_connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

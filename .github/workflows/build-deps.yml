name: Build Deps

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 11 * * 1,4"

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      packages: write
    name: Prepare Build
    runs-on: ubuntu-24.04
    outputs:
      docker_distros: ${{ steps.set_matrix.outputs.docker_distros }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache cake frosting
        id: cache-cake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: run
          key: run-${{ runner.os }}-${{ hashFiles('./build/**') }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: build/global.json

      - name: "[Prepare]"
        if: steps.cache-cake.outputs.cache-hit != 'true'
        run: dotnet build build/ --configuration=Release

      - name: "[Matrix]"
        id: set_matrix
        run: dotnet run/build.dll --target=SetMatrix

  build_deps:
    permissions:
      contents: read
      packages: write
    name: Build Deps (${{ matrix.arch }})
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/_build-deps.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      docker_distros: ${{ needs.prepare.outputs.docker_distros }}
      push_images: ${{ github.event_name != 'pull_request' && github.repository_owner == 'GitTools' }}

  build_deps_manifests:
    permissions:
      contents: read
      packages: write
    name: Build Deps Manifests
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    needs: [prepare, build_deps]
    uses: ./.github/workflows/_build-deps-manifest.yml
    with:
      docker_distros: ${{ needs.prepare.outputs.docker_distros }}
      push_images: ${{ github.event_name != 'pull_request' && github.repository_owner == 'GitTools' }}

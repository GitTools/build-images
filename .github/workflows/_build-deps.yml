on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      docker_distros:
        required: true
        type: string
      push_images:
        required: true
        type: boolean
      dockerhub_oidc_connection_id:
        required: true
        type: string
env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"
  PUSH_IMAGES: ${{ inputs.push_images }}

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build_deps:
    name: ${{ matrix.docker_distro }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        docker_distro: ${{ fromJson(inputs.docker_distros) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use cached cake frosting
        id: cache-cake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: run
          key: run-${{ runner.os }}-${{ hashFiles('./build/**') }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: build/global.json

      - name: Set up Docker
        uses: ./.github/actions/docker-setup

      - name: Publish image to DockerHub
        if: env.PUSH_IMAGES == 'true'
        uses: ./.github/actions/build-deps
        with:
          arch: ${{ inputs.arch }}
          docker_distro: ${{ matrix.docker_distro }}
          docker_registry: docker.io
          docker_registry_name: dockerhub
          dockerhub_organization: gittools
          dockerhub_oidc_connection_id: ${{ inputs.dockerhub_oidc_connection_id }}

      - name: Publish image to GitHub
        uses: ./.github/actions/build-deps
        with:
          arch: ${{ inputs.arch }}
          docker_distro: ${{ matrix.docker_distro }}
          docker_registry: ghcr.io
          docker_registry_name: github
          docker_registry_username: ${{ github.repository_owner }}
          docker_registry_password: ${{ github.token }}

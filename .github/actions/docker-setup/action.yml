name: 'Docker Setup'
description: 'Setups the docker engine'

runs:
  using: 'composite'
  steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
      with:
        daemon-config: |
          {
            "dns": ["1.1.1.1", "8.8.8.8"],
            "features": {
              "containerd-snapshotter": true
            }
          }
    - name: Check build container DNS
      shell: bash
      run: bash "${{ github.action_path }}/check-dns.sh"
